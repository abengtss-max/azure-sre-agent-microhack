# k6 in-cluster load generator for Aetherion AirOps.
#
# The k6 script is supplied via a ConfigMap. Create/update it from the source file:
#   kubectl -n aetherion create configmap k6-script \
#     --from-file=k6-load.js=load/k6-load.js -o yaml --dry-run=client | kubectl apply -f -
#
# Then apply this manifest. Toggle load with:
#   Normal:  kubectl -n aetherion set env deploy/k6-load MODE=normal VUS=25
#   Surge:   kubectl -n aetherion set env deploy/k6-load MODE=surge  VUS=120
#   BASE_URL and API_KEY are patched by scripts/03-deploy-app.ps1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-load
  namespace: aetherion
  labels:
    app: k6-load
    tier: load
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k6-load
  template:
    metadata:
      labels:
        app: k6-load
        tier: load
    spec:
      containers:
        - name: k6
          image: grafana/k6:latest
          command: ["k6", "run", "/scripts/k6-load.js"]
          env:
            - name: BASE_URL
              value: "REPLACE_WITH_APIM_GATEWAY_URL"
            - name: MODE
              value: "normal"
            - name: VUS
              value: "25"
            - name: API_KEY
              value: ""
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script
