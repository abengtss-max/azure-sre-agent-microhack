# Aetherion AirOps workloads on AKS.
#
# Image and connection values are patched by scripts/03-deploy-app.ps1:
#   - image: ${ACR_LOGIN_SERVER}/aetherion-airops:latest
#   - Secret "aetherion-secrets" (DB/Redis/App Insights) is created from Bicep outputs.
#
# All six services run from the SAME image, differentiated by the ROLE env var.
apiVersion: v1
kind: Namespace
metadata:
  name: aetherion
  labels:
    app.kubernetes.io/part-of: aetherion-airops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aetherion-config
  namespace: aetherion
data:
  PGDATABASE: "aetherion"
  PGPORT: "5432"
  REDIS_PORT: "6379"
  REDIS_TLS: "false"
  PG_POOL_MAX: "5"
---
# ---------------- redis (in-cluster cache) ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aetherion
  labels: { app: redis, tier: data }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata:
      labels: { app: redis, tier: data }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe: { tcpSocket: { port: 6379 }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 6379 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: "50m", memory: "64Mi" }, limits: { cpu: "250m", memory: "256Mi" } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aetherion
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
# ---------------- gateway (Ops Center GUI + aggregator) ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: aetherion
  labels: { app: gateway, tier: edge }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway, tier: edge }
    spec:
      containers:
        - name: gateway
          image: REPLACE_ACR/aetherion-airops:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ROLE, value: "gateway" }
            - { name: SVC_PROFILE, value: "standard" }
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom: { secretKeyRef: { name: aetherion-secrets, key: APPLICATIONINSIGHTS_CONNECTION_STRING } }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "256Mi" } }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aetherion
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8080 }]
---
# ---------------- flight-ops ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-ops
  namespace: aetherion
  labels: { app: flight-ops, tier: service }
spec:
  replicas: 2
  # Recreate so a `crash` fault takes the service fully down (the flight board
  # goes dark). Under the default RollingUpdate, maxUnavailable rounds to 0 and
  # the old healthy pods keep serving because the crashing pods never go Ready.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: flight-ops } }
  template:
    metadata:
      labels: { app: flight-ops, tier: service }
    spec:
      containers:
        - name: flight-ops
          image: REPLACE_ACR/aetherion-airops:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: aetherion-config } }]
          env:
            - { name: ROLE, value: "flight-ops" }
            - { name: SVC_PROFILE, value: "standard" }
            - { name: PGHOST, valueFrom: { secretKeyRef: { name: aetherion-secrets, key: PGHOST } } }
            - { name: PGUSER, valueFrom: { secretKeyRef: { name: aetherion-secrets, key: PGUSER } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: aetherion-secrets, key: PGPASSWORD } } }
            - { name: APPLICATIONINSIGHTS_CONNECTION_STRING, valueFrom: { secretKeyRef: { name: aetherion-secrets, key: APPLICATIONINSIGHTS_CONNECTION_STRING } } }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "256Mi" } }
---
apiVersion: v1
kind: Service
metadata: { name: flight-ops, namespace: aetherion }
spec:
  selector: { app: flight-ops }
  ports: [{ port: 80, targetPort: 8080 }]
---
