# ---------------- Horizontal Pod Autoscalers ----------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: crew-scheduling, namespace: aetherion }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: crew-scheduling }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: booking, namespace: aetherion }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: booking }
  minReplicas: 2
  maxReplicas: 6
